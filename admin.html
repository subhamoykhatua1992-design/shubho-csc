
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Shubho CSC</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef3f9;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .admin-login {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 30, 70, 0.10);
            text-align: center;
        }

        .admin-login h2 {
            color: #123c70;
            margin: 0 0 10px;
            font-size: 27px;
        }

        .admin-login p {
            color: #64748b;
            margin-bottom: 25px;
        }

        .admin-login input {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid #ccd6e2;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .admin-login input:focus {
            border-color: #1760a8;
        }

        .admin-login button {
            width: 100%;
            padding: 14px;
            background: #123c70;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-login button:hover {
            background: #1760a8;
        }

        #loginMessage {
            margin-top: 18px;
            font-size: 14px;
            font-weight: bold;
            color: #c62828;
        }

        .back-home {
            display: inline-block;
            margin-top: 22px;
            color: #1760a8;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="admin-login">

        <h2>SHUBHO CSC</h2>

        <p>Admin Panel Login</p>

        <form id="adminLoginForm">

            <input
                type="email"
                id="adminEmail"
                placeholder="Admin Email Address"
                required
            >

            <input
                type="password"
                id="adminPassword"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login to Dashboard
            </button>

        </form>

        <div id="loginMessage"></div>

        <a href="index.html" class="back-home">
            ← Back to Website
        </a>

    </div>

    <script type="module" src="admin.js"></script>

</body>
</html>
