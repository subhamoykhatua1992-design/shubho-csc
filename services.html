
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Services Management | Shubho CSC</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f3f6fb;
            font-family: Arial, sans-serif;
            color: #26364a;
        }

        .service-header {
            background: linear-gradient(120deg, #092c58, #1760a8);
            color: white;
            padding: 23px 5%;
        }

        .service-header h2 {
            margin: 0;
        }

        .service-container {
            max-width: 950px;
            margin: 35px auto;
            padding: 0 18px;
        }

        .service-box {
            background: white;
            padding: 25px;
            border-radius: 14px;
            border: 1px solid #e3eaf3;
            box-shadow: 0 5px 20px rgba(20,50,90,.05);
            margin-bottom: 25px;
        }

        .service-box h3 {
            color: #123c70;
            margin-top: 0;
        }

        .service-box input,
        .service-box textarea {
            width: 100%;
            padding: 13px;
            margin: 9px 0 15px;
            border: 1px solid #ccd6e2;
            border-radius: 8px;
            font-size: 15px;
        }

        .service-box button {
            background: #123c70;
            color: white;
            border: 0;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .service-box button:hover {
            opacity: .85;
        }

        .service-item {
            background: #f8faff;
            border: 1px solid #e1e9f3;
            border-left: 4px solid #1760a8;
            border-radius: 10px;
            padding: 18px;
            margin: 13px 0;
        }

        .service-item h4 {
            color: #123c70;
            margin: 0 0 8px;
        }

        .edit-btn {
            background: #e8f1ff !important;
            color: #1455a0 !important;
            border: 1px solid #b8d2f5 !important;
            margin: 8px 8px 0 0;
        }

        .delete-btn {
            background: #c62828 !important;
            margin: 8px 8px 0 0;
        }

        #message {
            margin-top: 12px;
            font-weight: bold;
        }

        @media(max-width: 600px) {
            .service-container {
                margin: 20px auto;
            }

            .service-box {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <header class="service-header">
        <h2>💼 Services Management</h2>
        <p>Shubho CSC Admin Panel</p>
    </header>

    <main class="service-container">

        <p>
            <a href="dashboard.html">← Back to Dashboard</a>
        </p>

        <section class="service-box">

            <h3 id="formHeading">নতুন পরিষেবা যোগ করুন</h3>

            <form id="serviceForm">

                <label>পরিষেবার Icon (Emoji)</label>
                <input
                    type="text"
                    id="serviceIcon"
                    placeholder="যেমন: 🪪 💻 🏦"
                    required
                >

                <label>পরিষেবার নাম</label>
                <input
                    type="text"
                    id="serviceTitle"
                    placeholder="যেমন: PAN Card Services"
                    required
                >

                <label>পরিষেবার বিবরণ</label>
                <textarea
                    id="serviceDescription"
                    rows="4"
                    placeholder="পরিষেবার বিস্তারিত লিখুন"
                    required
                ></textarea>

                <button type="submit" id="saveBtn">
                    Publish Service
                </button>

                <button
                    type="button"
                    id="cancelBtn"
                    class="edit-btn"
                    style="display:none;"
                >
                    Cancel Edit
                </button>

            </form>

            <div id="message"></div>

        </section>

        <section class="service-box">

            <h3>প্রকাশিত পরিষেবাগুলি</h3>

            <div id="serviceList">Loading...</div>

        </section>

    </main>

    <script type="module" src="services.js"></script>

</body>
</html>
